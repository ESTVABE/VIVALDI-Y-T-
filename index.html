<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivaldi y tú</title>

    <style>
        body {
            margin: 0;
            background: #000000;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 28px;
            font-weight: normal;
            margin-bottom: 50px;
        }

        .audio {
            max-width: 500px;
            margin: 0 auto 45px auto;
        }

        h2 {
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 15px;
        }

        audio {
            width: 100%;
        }
    </style>
</head>

<body>

    <h1>🎵 VIVALDI Y TÚ</h1>

    <div class="audio" id="violin">
        <h2>🎻 El violín</h2>
        <audio controls>
            <source src="violin.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="audio" id="primavera">
        <h2>🌸 La primavera</h2>
        <audio controls>
            <source src="primavera.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="audio" id="verano">
        <h2>☀️ El verano</h2>
        <audio controls>
            <source src="verano.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="audio" id="otono">
        <h2>🍂 El otoño</h2>
        <audio controls>
            <source src="otono.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="audio" id="invierno">
        <h2>❄️ El invierno</h2>
        <audio controls>
            <source src="invierno.mp3" type="audio/mpeg">
        </audio>
    </div>

</body>
</html>
